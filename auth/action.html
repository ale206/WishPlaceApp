<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying your request... | Wishplace</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f9f9f9; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #e74c3c; display: none; }
        .success { color: #2ecc71; display: none; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
    </style>
    <!-- Consent Manager -->

    <!-- Google tag (gtag.js) -->
    <!-- Google Consent Mode v2 (default: denied until user accepts) -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        var consentChoice = localStorage.getItem('wp_consent');
        var consentGranted = consentChoice === 'granted';

        gtag('consent', 'default', {
            analytics_storage: consentGranted ? 'granted' : 'denied',
            ad_storage:         consentGranted ? 'granted' : 'denied',
            ad_user_data:       consentGranted ? 'granted' : 'denied',
            ad_personalization: consentGranted ? 'granted' : 'denied',
            wait_for_update: 500
        });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YLJR19TYZF"></script>
    <script>
        gtag('js', new Date());
        gtag('config', 'G-YLJR19TYZF');
        gtag('config', 'AW-986680353');
    </script>
</head>
<body>

<div class="card">
    <div id="loading">
        <div class="spinner"></div>
        <p>Processing your request...</p>
    </div>

    <div id="success-msg" class="success">
        <h2>Success!</h2>
        <p id="status-text">Your email has been verified.</p>
        <button onclick="window.location.href='/'">Go to Wishplace</button>
    </div>

    <div id="error-msg" class="error">
        <h2>Something went wrong</h2>
        <p id="error-text">The link may be expired or already used.</p>
        <button onclick="window.location.href='/'">Back to Home</button>
    </div>
</div>

<script type="module">
    // Import the functions you need from the SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, applyActionCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyA5UNRWWKx8NTG5qBd_wzVWGh_yNcBbdaw",
        authDomain: "wishplaceapp.firebaseapp.com",
        projectId: "wishplaceapp",
        storageBucket: "wishplaceapp.firebasestorage.app",
        messagingSenderId: "510347886026",
        appId: "1:510347886026:web:9ef69423887cb20ddc2333",
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 1. Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const actionCode = urlParams.get('oobCode');

    const loadingEl = document.getElementById('loading');
    const successEl = document.getElementById('success-msg');
    const errorEl = document.getElementById('error-msg');
    const statusText = document.getElementById('status-text');
    const errorText = document.getElementById('error-text');

    // 2. Handle the action based on the "mode"
    if (actionCode) {
        switch (mode) {
            case 'verifyEmail':
                handleVerifyEmail(auth, actionCode);
                break;
            case 'resetPassword':
                // Optional: Redirect to your own custom reset page
                window.location.href = `/reset-password?oobCode=${actionCode}`;
                break;
            default:
                showError("Invalid request mode.");
        }
    } else {
        showError("No action code found in the link.");
    }

    function handleVerifyEmail(auth, actionCode) {
        applyActionCode(auth, actionCode)
            .then(() => {
                loadingEl.style.display = 'none';
                successEl.style.display = 'block';
                statusText.innerText = "Your email has been successfully verified! You can now log in.";
            })
            .catch((error) => {
                showError(error.message);
            });
    }

    function showError(message) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorText.innerText = message;
    }
</script>


<!-- Cookie Consent Banner -->
<div id="wp-consent" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#fff;border-top:1px solid #dbe2ef;padding:16px 24px;box-shadow:0 -4px 20px rgba(0,0,0,.08);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#333">
    <div style="max-width:960px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <p style="margin:0;flex:1;min-width:200px">
            <span id="wp-consent-text">We use cookies for analytics and advertising.</span>
            <a id="wp-consent-link" href="/legal/privacy-enGB.html" style="color:#1769ff;text-decoration:underline">Privacy Policy</a>
        </p>
        <div style="display:flex;gap:8px;flex-shrink:0">
            <button id="wp-consent-btn-deny" onclick="wpConsent('denied')" style="padding:8px 16px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">Decline</button>
            <button id="wp-consent-btn-accept" onclick="wpConsent('granted')" style="padding:8px 16px;border:none;border-radius:8px;background:#1769ff;color:#fff;cursor:pointer;font-size:14px">Accept</button>
        </div>
    </div>
</div>
<script>
    function wpConsent(choice) {
        localStorage.setItem('wp_consent', choice);
        document.getElementById('wp-consent').style.display = 'none';
        gtag('consent', 'update', {
            analytics_storage: choice,
            ad_storage: choice,
            ad_user_data: choice,
            ad_personalization: choice
        });
    }
    if (!localStorage.getItem('wp_consent')) {
        var lang = localStorage.getItem('language') || navigator.language || 'en';
        var isEs = lang.toLowerCase().startsWith('es');
        if (isEs) {
            document.getElementById('wp-consent-text').innerText = 'Usamos cookies para analítica y publicidad.';
            document.getElementById('wp-consent-link').innerText = 'Política de privacidad';
            document.getElementById('wp-consent-link').href = '/legal/privacy-esES.html';
            document.getElementById('wp-consent-btn-deny').innerText = 'Rechazar';
            document.getElementById('wp-consent-btn-accept').innerText = 'Aceptar';
        }
        document.getElementById('wp-consent').style.display = 'block';
    }
</script>
</body>
</html>
